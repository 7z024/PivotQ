       0.05754179225620465, -0.023529718740523457]
  execution:
    mode: density_matrix_exact_expectation
    device: cpu
    shots: null
    sampling_seed: 20260828
    noise: true
    gradient_method: parameter_shift
    noise_model:
      T1_us: 35.0
      T2_us: 3.5
      ry_fidelity: 0.998
      cz_fidelity: 0.992
      ry_duration_ns: 56.0
      cz_duration_ns: 34.0
      readout_duration_ns: 1000.0
      idle_relaxation: true
      rz_virtual: true
      readout_assignment_error: null
  training:
    optimizer: {name: adam}
    learning_rate: 0.001
    gradient_clip_norm: 5.0
    classical_warmup_epochs: 0
    learning_rate_scheduler: {name: none}
    l2: 0.0

classical:
  backend: torch_mlp
  device: cpu
  dtype: float64
  feature_transform: {name: identity}
  linear_initialization: {name: random}
  noise_feature_correction: {enabled: false}
  hidden_dims: [32, 32]
  activation: silu
  epochs: 100
  optimizer: {name: adam}
  learning_rate: 0.001
  learning_rate_scheduler: {name: none}
  l2: 0.0
  seed: 20260829
  early_stopping:
    enabled: true
    patience: 20
    min_delta_eV2: 1.0e-10
  history_interval: 1
  stability_guard: {}

force:
  backend: cartesian_central_finite_difference
  step_A: 0.001
  project_rigid_body_residuals: true
  production_method: cartesian_centered_finite_difference
  candidate_method: input_angle_parameter_shift_chain_rule
  candidate:
    input_shift: pi/2
    quantum_derivative: parameter_shift
    classical_feature_gradient: pytorch_backprop
    geometry_jacobian: pytorch_autograd
    state_preparations_per_geometry: 7
    measurement_bases: [Z, X]
    common_random_numbers: false
  validation:
    status: stopped_after_10step_finite_shot_energy_gate
    exact_consistency_pass: true
    noisy_exact_consistency_pass: true
    finite_shot_pass: true
    aimd_pass: false

