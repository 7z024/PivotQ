experiment:
  name: h2o_f2a2_finite_shot_robustness
  protocol_path: /Users/zhanghao/Downloads/H2O_F2A2_Finite_Shot_Robustness_Codex_Plan.md
  protocol_sha256: 6596fcce2a19e06ae132522af64e7d83f5700a791bb4cfcc416cad2976484415
  seed: 20260829
  output_root: outputs/finite_shot_robustness_campaign
  base_runtime_config: outputs/data_force_campaign/08_noisy_adaptation/resolved_noise_config.yaml

dataset:
  energy_path: data/h2o_pyscf_sto3g_fci_energy_development_v2.csv
  energy_sha256: 18361f86f91c9e1091bce61f0ed442dbc2038622b50b2b66161899b05bf038af
  force_path: data/h2o_pyscf_sto3g_fci_force_development_v2.csv
  force_sha256: 39bf334bf55486e3ba073bfd1c0732999886d0cee7786d4670f4654a00ee9a92
  frozen_energy_split: {train: 800, validation: 100, test: 100}
  frozen_force_split: {train: 280, validation: 40, test: 30}
  selection_split: validation_only
  historical_locked_tests_allowed_for_selection: false

checkpoint:
  parent_checkpoint: outputs/data_force_campaign/08_noisy_adaptation/03_noise_adaptation/checkpoints/mlp_only_noise_aware.pt
  parent_checkpoint_sha256: 81d7bc95fdbe96b2ef136854fc903ae09a5dc0038175dd98ac707d423b8e9f9a
  final_checkpoint: checkpoints/hybrid_model_finite_shot_robust.pt
  overwrite_existing_models: false

finite_shot_robustness:
  enabled: true
  problematic_features:
    - name: IXX
      expected_training_std_approx: 0.002467
      expected_baseline_variance_contribution_approx: 0.99774
  strict_candidate_order:
    - A0_ORIGINAL_14F
    - B1_DROP_IXX_MLP_ONLY
    - B2_DROP_IXX_JOINT_IF_REQUIRED
    - C1_14F_SHOT_AWARE_SCALER
    - C2_13F_SHOT_AWARE_SCALER
    - D1_14F_SHOT_AUGMENTED
    - D2_13F_SHOT_AUGMENTED
    - E1_SENSITIVITY_REGULARIZED_IF_REQUIRED

readout:
  original_feature_dimension: 14
  original_features: [ZII, IZI, IIZ, ZZI, ZIZ, IZZ, ZZZ, XII, IXI, IIX, XXI, XIX, IXX, XXX]
  active_feature_dimension: null
  dropped_features: []
  quantum_measurement_order_unchanged: true

shots:
  validation_values: [1000, 3000, 10000, 30000, 100000]
  training_values: [1000, 3000, 10000]
  repeat_seeds: [20260827, 20260828, 20260829, 20260830, 20260831]
  diagnostic_seed_start: 20261000
  diagnostic_seed_count: 32
  design_shots: 3000
  bases: [Z, X]
  joint_bitstring_sampling: true

shot_aware_scaler:
  enabled: true
  formula: max_signal_kappa_shot
  kappa_values: [0.0, 0.5, 1.0, 2.0]
  design_shots: 3000

shot_augmentation:
  enabled: true
  shot_values: [1000, 3000, 10000]
  finite_shot_batch_fractions: [0.5, 0.7, 0.9]
  exact_feature_batch_fraction: one_minus_finite_shot_fraction
  seed_changes_each_epoch: true

sensitivity_regularization:
  enabled_if_required: true
  trigger_max_variance_concentration: 0.80
  trigger_no_practical_shot_setting: true
  lambda_values: [0.001, 0.01, 0.1]
  covariance_mode: diagonal_marginal_variance

training:
  finite_shot_aware: true
  mode: mlp_only_first
  hidden_dims: [32, 32]
  activation: silu
  epochs: 120
  patience: 25
  learning_rate: 0.001
  weight_decay: 0.0
  gradient_clip_norm: 5.0
  joint_fine_tuning_only_if_required: true
  joint_epochs: 30
  joint_quantum_learning_rate: 0.0002

selection:
  exact_noisy_energy_max_relative_to_A0: 1.10
  exact_noisy_energy_absolute_tolerance_eV: 0.01
  practical_energy_sampling_rmse_max_eV: 0.03
  practical_force_sampling_rmse_max_eV_per_A: 0.15
  total_energy_rmse_max_relative_to_exact: 1.10
  total_force_rmse_max_relative_to_exact: 1.10
  max_variance_concentration: 0.80
  primary_shot_region: [1000, 100000]

force_validation:
  development_split: validation
  exact_evaluators:
    - input_angle_parameter_shift_chain_rule
    - cartesian_centered_finite_difference
  finite_shot_primary_evaluator: input_angle_parameter_shift_chain_rule
  finite_shot_cartesian_control: true
  validation_shots: [1000, 3000, 10000, 30000, 100000]

aimd:
  enabled_after_energy_and_force_gate: true
  stage_steps: [1, 10, 100, 1000]
  shot_seeds: [20260827, 20260828, 20260829, 20260830, 20260831]
  fixed_initial_geometry: true
  fixed_initial_velocities: true
  only_shot_seed_changes: true

plots:
  backend: matplotlib
  dpi: 220
  format: png
  nature_figure_used: false
