[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "h2o-hybrid-aimd"
version = "0.1.0"
description = "H2O quantum-classical hybrid potential and NVE AIMD application"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "ase>=3.29,<4",
    "jsonschema>=4.25,<5",
    "matplotlib>=3.10,<4",
    "numpy>=2.5,<3",
    "PyYAML>=6.0,<7",
    "qiskit>=2.4,<3",
    "torch==2.13.0+cpu",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.setuptools.packages.find]
include = ["single_h20_aimd*"]

[tool.setuptools.package-data]
"single_h20_aimd.integration.fusion_framework" = ["*.json", "*.md", "*.yaml"]
