name: Dashboard
on:
  push:
    paths: ['Dockerfile', '.dockerignore', 'dashboard/**', 'pyproject.toml', 'uv.lock', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['Dockerfile', '.dockerignore', 'dashboard/**', 'pyproject.toml', 'uv.lock', '.github/workflows/dashboard.yml']
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test && npm run check:dist
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked python -m unittest discover -s dashboard/tests/backend -v
        env:
          PYTHONPATH: dashboard
